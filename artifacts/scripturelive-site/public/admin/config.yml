backend:
  name: github
  repo: nanvilow/scripturelive-ai
  branch: main
  base_url: https://scriptureliveai.com
  auth_endpoint: oauth/auth

site_url: https://scriptureliveai.com
display_url: https://scriptureliveai.com

media_folder: artifacts/scripturelive-site/public/uploads
public_folder: /uploads

collections:
  - name: site
    label: "Site Content"
    delete: false
    editor:
      preview: false
    files:
      - name: page-content
        label: "Hero, Support & Why-section text"
        file: artifacts/scripturelive-site/src/content/page-content.json
        format: json
        fields:
          - name: items
            label: "Content entries"
            widget: list
            summary: "{{fields.key}}"
            fields:
              - { name: id, label: "ID (don't change)", widget: number, required: true }
              - { name: key, label: "Key (don't change)", widget: string, hint: "hero_headline, hero_subtext, why_description, support_whatsapp, support_email, demo_url" }
              - { name: value, label: "Value", widget: text }

      - name: features
        label: "Features (cards)"
        file: artifacts/scripturelive-site/src/content/features.json
        format: json
        fields:
          - name: items
            label: "Features"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "ID (unique number, never reuse)", widget: number, required: true }
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: icon, label: "Icon name (lucide)", widget: string, hint: "e.g. brain, video, monitor, palette, book-open, mic, shield-check, refresh-cw, message-square" }
              - { name: sortOrder, label: "Sort order", widget: number, default: 1 }

      - name: pricing
        label: "Pricing tiers"
        file: artifacts/scripturelive-site/src/content/pricing.json
        format: json
        fields:
          - name: items
            label: "Pricing tiers"
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: id, label: "ID", widget: number, required: true }
              - { name: name, label: "Tier name", widget: string }
              - { name: price, label: "Price", widget: string, hint: "e.g. Free, GHS 200, GHS 1,800" }
              - { name: period, label: "Period", widget: string, hint: "e.g. forever, per month, Year" }
              - { name: description, label: "Description", widget: text }
              - name: features
                label: "Feature bullets"
                widget: list
                field: { name: feature, label: "Feature", widget: string }
              - { name: isPopular, label: "Mark as most popular?", widget: boolean, default: false }
              - { name: sortOrder, label: "Sort order", widget: number, default: 1 }

      - name: testimonials
        label: "Testimonials"
        file: artifacts/scripturelive-site/src/content/testimonials.json
        format: json
        fields:
          - name: items
            label: "Testimonials"
            widget: list
            summary: "{{fields.name}} — {{fields.church}}"
            fields:
              - { name: id, label: "ID (unique number)", widget: number, required: true }
              - { name: name, label: "Name", widget: string }
              - { name: church, label: "Church", widget: string }
              - { name: quote, label: "Quote", widget: text }
              - { name: photoUrl, label: "Photo (optional)", widget: image, required: false, default: null }
              - { name: sortOrder, label: "Sort order", widget: number, default: 0 }

      - name: downloads
        label: "Downloads"
        file: artifacts/scripturelive-site/src/content/downloads.json
        format: json
        fields:
          - name: items
            label: "Download links"
            widget: list
            summary: "{{fields.label}} ({{fields.platform}})"
            fields:
              - { name: id, label: "ID", widget: number, required: true }
              - { name: label, label: "Button label", widget: string }
              - { name: url, label: "Download URL", widget: string }
              - { name: version, label: "Version", widget: string }
              - { name: platform, label: "Platform", widget: string }
              - { name: isActive, label: "Active?", widget: boolean, default: true }

      - name: hero-buttons
        label: "Hero secondary buttons"
        file: artifacts/scripturelive-site/src/content/hero-buttons.json
        format: json
        fields:
          - name: items
            label: "Hero buttons (next to DOWNLOAD NOW)"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: id, label: "ID", widget: number, required: true }
              - { name: label, label: "Button text", widget: string }
              - { name: url, label: "Link URL", widget: string }
              - { name: icon, label: "Icon name (lucide PascalCase, e.g. BookOpen)", widget: string }
              - { name: variant, label: "Style variant", widget: select, options: ["primary", "secondary"], default: "primary" }
              - { name: sortOrder, label: "Sort order", widget: number, default: 1 }
